<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sobre — Hnl</title>
  <meta name="description" content="Sobre Hnl: biografia, exposições, publicações e perguntas frequentes.">
  <meta name="theme-color" content="#0b0b0b">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Sobre — Hnl">
  <meta property="og:image" content="https://carlos-hnl.github.io/Portfolio-project/img/compartilhar.jpg">

  <link rel="icon" href="img/logo-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/obras.js" defer></script>
  <script src="assets/imagens.js" defer></script>
  <script src="assets/main.js" defer></script>
</head>
<body data-pagina="sobre">
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo"></header>

  <main id="conteudo">
    <section class="secao sobre sobre-pagina">
      <figure class="sobre-foto">
        <img id="sobre-foto" src="" alt="Retrato do artista" loading="eager">
      </figure>
      <div class="sobre-texto">
        <p class="rotulo">Sobre</p>
        <h1 id="sobre-titulo"></h1>
        <div id="sobre-bio"></div>
        <p class="sobre-local" id="sobre-local"></p>
      </div>
    </section>

    <section class="secao curriculo" id="curriculo" hidden>
      <h2>Trajetória</h2>
      <div class="curriculo-colunas" id="curriculo-colunas"></div>
    </section>

    <section class="secao faq revelar" id="faq">
      <h2>Perguntas frequentes</h2>
      <div class="faq-lista" id="faq-lista"></div>
    </section>

    <section class="secao contato revelar" id="contato">
      <p class="rotulo">Contato</p>
      <h2>Ficou alguma dúvida?</h2>
      <p>Escreva para mim.</p>
      <a class="contato-email" data-email href="#"></a>
      <ul class="contato-links" data-redes></ul>
    </section>
  </main>

  <footer class="rodape"></footer>
</body>
</html>
